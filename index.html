function unitOpen(i) { const s = unitPath[unitPath.length - 1]; unitRun(...UNIT_NEXT[s.cmd.action](s.res.names[i], s.res)); }

// Live measurements: watch several measurement groups at once, re-reading them on an interval.
// Each group is read with the same read_measurement_group action as the single-group drill-down;
// values that differ from the previous read are highlighted so changes are easy to spot.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const curStep = () => unitPath[unitPath.length - 1];
function stopLive() { unitPath.forEach(s => { if (s.live) s.running = false; }); }
function measSelectAll(on) { document.querySelectorAll('.measpick').forEach(c => { if (!c.closest('label').hidden) c.checked = on; }); }

function liveStart() {
  const groups = [...document.querySelectorAll('.measpick:checked')].map(c => curStep().res.names[+c.value]);
  if (!groups.length) { alert('Tick at least one measurement group.'); return; }
  stopLive();
  const step = {cmd: {action: 'measurement_live'}, label: `Live · ${groups.length} group${groups.length > 1 ? 's' : ''}`,
    live: true, running: true, interval: 1000, groups, data: {}, history: {}};
  unitPath = [...unitPath, step];
  renderUnitDetail();
  liveLoop(step);
}

async function liveLoop(step) {
  if (step.looping) return;  // one loop per step, even if resumed twice quickly
  step.looping = true;
  try {
    while (step.running && curStep() === step) {
      const u = units.find(u => u.index === unitSel);
      if (!u) break;
      for (const g of step.groups) {
        if (!step.running || curStep() !== step) break;
        try {
          const rows = resultRows(await bridge({action: 'read_measurement_group', group: g, address: u.id}));
          const prev = step.data[g] && step.data[g].rows;
          if (prev) { const was = new Map(prev.map(r => [r.name, r.value])); rows.forEach(r => r.changed = was.has(r.name) && was.get(r.name) !== r.value); }
          const hist = step.history[g] || (step.history[g] = {});  // numeric samples per parameter, for a sparkline
          rows.forEach(r => {
            const s = String(r.value).trim().replace(',', '.'), num = parseFloat(s);
            if (/^[+-]?\d/.test(s) && isFinite(num)) {
              const h = hist[r.name] || (hist[r.name] = []);
              h.push(num); if (h.length > 60) h.shift();
              r.hist = h;
            }
          });
          step.data[g] = {rows};
        } catch (e) { step.data[g] = {err: e.message}; }
        renderLive(step);
      }
      await sleep(step.interval);
    }
  } finally { step.looping = false; }
}

// The loop updates only the values container, so polling never disturbs the controls or the filter.
function renderLive(step) {
  if (curStep() !== step) return;
  const el = $('#liveOut');
  if (el) el.innerHTML = liveTable(step);
}

function liveHTML(step) {
  return `<div class="bar">
      ${step.running ? '<button onclick="liveStop()">Stop</button>' : '<button onclick="liveResume()">Start</button>'}
      <label class="meta">Interval <input type="number" min="200" step="100" value="${step.interval}" style="width:5em" onchange="liveSetInterval(this.value)"> ms</label>
      <span class="meta">${step.running ? 'updating…' : 'paused'}</span></div>
    <div id="liveOut">${liveTable(step)}</div>`;
}

function liveTable(step) {
  return step.groups.map(g => {
    const d = step.data[g], head = `<tr><th colspan="4">${esc(g)}</th></tr>`;
    if (!d) return `<table class="vals">${head}<tr><td colspan="4" class="meta">reading…</td></tr></table>`;
    if (d.err) return `<table class="vals">${head}<tr class="err"><td colspan="4">${esc(d.err)}</td></tr></table>`;
    const rows = d.rows.length ? d.rows.map(r =>
      `<tr class="${r.changed ? 'changed' : ''}"><td style="padding-left:${4 + 14 * r.depth}px">${esc(r.name)}</td><td>${esc(r.value)}</td><td>${esc(r.unit || '')}</td><td class="sparkcell">${sparkline(r.hist)}</td></tr>`).join('')
      : `<tr><td colspan="4" class="meta">no values</td></tr>`;
    return `<table class="vals">${head}${rows}</table>`;
  }).join('');
}

// A small inline-SVG line of a numeric parameter's recent samples, auto-scaled to its own range.
function sparkline(h) {
  if (!h || h.length < 2) return '';
  const w = 90, ht = 18, min = Math.min(...h), max = Math.max(...h), span = max - min || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * (w - 2) + 1).toFixed(1)},${(ht - 1 - (v - min) / span * (ht - 2)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none">
    <title>${h.length} samples · min ${min} · max ${max} · now ${h[h.length - 1]}</title><polyline points="${pts}"/></svg>`;
}

function liveStop() { const s = curStep(); if (s && s.live) { s.running = false; renderUnitDetail(); } }
function liveResume() { const s = curStep(); if (s && s.live && !s.running) { s.running = true; renderUnitDetail(); liveLoop(s); } }
function liveSetInterval(v) { const s = curStep(); if (s && s.live) s.interval = Math.max(200, +v || 1000); }
// Collapsible JSON viewer. A node's children are rendered when it is first opened, so huge
// replies stay fast; nodes holding an ODIS value preview its name and value.
const jsonNodes = [];
function jsonView(v) {
  const id = jsonNodes.push(v) - 1;
  return `<div class="json"><button onclick="copy(JSON.stringify(jsonNodes[${id}], null, 2))">Copy JSON</button>${jsonNode(null, v, 0)}</div>`;
}
function jsonNode(key, v, depth) {
  const k = key === null ? '' : `<span class="k">${esc(key)}</span>: `;
  if (v === null || typeof v !== 'object') {
    const cls = v === null ? 'n' : typeof v === 'string' ? 's' : typeof v === 'number' ? 'd' : 'b';
    return `<div class="leaf">${k}<span class="${cls}">${esc(typeof v === 'string' ? v : JSON.stringify(v))}</span></div>`;
  }
  const arr = Array.isArray(v), n = arr ? v.length : Object.keys(v).length;
  let hint = arr ? `[${n}]` : `{${n}}`;
  if (!arr && 'translatedValue' in v) hint = `${v.translatedName && v.translatedName !== '---' ? v.translatedName : v.name} = ${v.translatedValue}${v.unit ? ' ' + v.unit : ''}`;
  else if (!arr && v._type) hint = `${v._type} {${n}}`;
  const id = jsonNodes.push(v) - 1, open = depth < 1;
  return `<details ${open ? 'open' : ''} data-json="${id}" ontoggle="jsonFill(this)"><summary>${k}<span class="t">${esc(hint)}</span></summary>${open ? jsonChildren(v, depth) : ''}</details>`;
}
function jsonChildren(v, depth) { return Object.entries(v).map(([k, x]) => jsonNode(k, x, depth + 1)).join(''); }
function jsonFill(el) {
  if (el.open && el.children.length === 1) el.insertAdjacentHTML('beforeend', jsonChildren(jsonNodes[+el.dataset.json], 1));
}

function filterNames(input) {
  const q = input.value.trim().toLowerCase();
  input.nextElementSibling.querySelectorAll('button, span, label').forEach(b => b.hidden = q && !b.textContent.toLowerCase().includes(q));
}
function unitBack(i) { unitPath = unitPath.slice(0, i + 1); renderUnitDetail(); }

// Runs a bridge command against the selected unit and shows it as the next step of the path.
async function unitRun(cmd, label) {
  const u = units.find(u => u.index === unitSel), step = {cmd, label, busy: true}, path = unitPath = [...unitPath, step];
  renderUnitDetail();
  try { step.res = await bridge({...cmd, address: u.id}); }
  catch (e) { step.err = e.message; }
  step.busy = false;
  if (step.res && cmd.action === 'read_coding') {
    step.unitVariant = u.variant;
    const master = (step.res.coding || [])[0] || {};
    step.sysName = master.systemName || 'master';
    step.orig = master.byteCoding ? bytesOf(master.byteCoding.replace(/\s/g, '')) : [];
    step.work = step.orig.slice();
    step.odx = await codingDefinition(u);
    step.unitLabels = await loadUnitLabels(u.variant, step.sysName);
    if (step.odx && !step.odx.own) await applyCodingPref(step);  // reuse a remembered related variant
    if (unitPath === path) renderUnitDetail();
  }
  if (step.res && cmd.action === 'read_adaptation') {
    try {
      const o = await bridge({action: 'adaptation_options', address: u.id, channel: cmd.channel});
      step.options = {};
      (o.params || []).forEach(p => { step.options[p.name] = p.options; });
    } catch (e) { step.options = {}; }
    if (unitPath === path) renderUnitDetail();
  }
  if (step.res && cmd.action === 'read_identification') {  // refresh the unit's row with what ODIS just identified
    const g = n => idVal(step.res, n);
    const set = (k, v) => { if (v !== undefined && v !== null && v !== '') u[k] = String(v).trim(); };
    set('swpnr', g('Param_VWSparePartNumbe')); set('swver', g('Param_VWAppliSoftwVersiNumbe'));
    set('hwpnr', g('Param_VWECUHardwNumbe')); set('hwver', g('Param_VWECUHardwVersiNumbe'));
    set('variant', g('Param_ASAMODXFileIdent')); set('system', g('Param_VWSysteNameOrEnginType'));
    if (known(u.swpnr) && (!u.state || u.state === 'NOT_READ')) u.state = 'IDENTIFIED';
    renderUnitList();
  }
  if (step.res && step.res.event_memory) {  // a fresh read updates the unit's count in the list
    u.dtcs = (step.res.event_memory.eventMemoryEntries || []).length;
    renderUnitList();
  }
  if (unitPath === path) renderUnitDetail();
}

// The translated value of an identification parameter (e.g. Param_VWSparePartNumbe), searched
// through the identification result (and any nested children).
function idVal(res, name) {
  const find = arr => {
    for (const v of arr || []) {
      if (v && v.name === name) return v.translatedValue !== undefined ? v.translatedValue : v.value;
      if (v && v.children) { const r = find(v.children); if (r !== undefined) return r; }
    }
  };
  return find(res.identification);
}

// --- ODIS database (offline) ------------------------------------------------------------
// Unit database and Trouble codes read ODIS's ODX data through the bridge, without the vehicle.
// Both tabs share one picker: a unit address gives its base data and variants, any other
// text searches variant names (part numbers such as 04C906026, or GV_/EV_ names).
let odxFound = null, odxLoc = null, odxUnit = null, odxTable = null, dtcList = null, lastBridge = null;

async function bridge(cmd) {
  const res = await api('POST', '/api/bridge', cmd);
  lastBridge = {cmd, res};
  return res;
}

function initDatabaseTabs() {
  for (const p of ['odx', 'dtc']) {
    $('#' + p).innerHTML = `<div class="bar"><input type="text" class="wide" id="${p}Q"
        placeholder="Unit address (0x0001) or part number / variant (04C906026, GV_ECM10…)"
        onkeydown="if (event.key === 'Enter') odxFind('${p}')"><button onclick="odxFind('${p}')">Find</button>
      <span class="status" id="${p}Msg"></span></div><div class="found" id="${p}Found"></div><div id="${p}Body"></div>`;
  }
}

function odxStatus(text, err) {
  for (const p of ['odx', 'dtc']) { const m = $(`#${p}Msg`); m.textContent = text || ''; m.classList.toggle('err', !!err); }
}

async function odxFind(p) {
  const q = $(`#${p}Q`).value.trim();
  if (!q) return;
  $('#odxQ').value = $('#dtcQ').value = q;
  const address = /^(0x)?[0-9a-f]{1,4}$/i.test(q) ? '0x' + parseInt(q, 16).toString(16).toUpperCase().padStart(4, '0') : null;
  odxStatus('Searching the ODIS database…');
  try {
    const res = await bridge(address ? {action: 'odx_variants', address} : {action: 'odx_variants', query: q});
    odxFound = {address, variants: res.variants};
    odxStatus(`${res.count} variants ${address ? `of unit ${address}` : `matching "${q}"`}`);
    renderFound();
    if (address) odxSelect(-1);
    else if (res.variants.length === 1) odxSelect(0);
  } catch (e) { odxStatus(e.message, true); }
}

function renderFound() {
  const f = odxFound, sel = odxLoc && odxLoc.cmd;
  const html = !f ? '' : `${f.variants.length > 20 ? '<input type="text" placeholder="Filter variants" oninput="filterNames(this)">' : ''}
    <div class="names">${f.address ? `<button class="${sel && sel.address ? 'on' : ''}" onclick="odxSelect(-1)">Base data ${esc(f.address)}</button>` : ''}
    ${f.variants.map((v, i) => `<button class="${sel && sel.variant === v.variant ? 'on' : ''}" title="${esc(v.base)}" onclick="odxSelect(${i})">${esc(v.variant)}</button>`).join('')}</div>`;
  $('#odxFound').innerHTML = $('#dtcFound').innerHTML = html;
}

// Selects the base data (-1) or a found variant and loads it into both database tabs.
async function odxSelect(i) {
  const v = odxFound.variants[i];
  const loc = odxLoc = i < 0 ? {label: `Base data of unit ${odxFound.address}`, cmd: {address: odxFound.address}}
    : {label: v.variant, cmd: {variant: v.variant, base: v.base}};
  odxUnit = odxTable = dtcList = null;
  renderFound(); renderOdx(); renderDtc();
  try {
    const unit = await bridge({action: 'odx_unit', ...loc.cmd});
    const dtcs = await bridge({action: 'odx_dtcs', ...loc.cmd});
    if (odxLoc !== loc) return;
    odxUnit = unit; dtcList = dtcs.dtcs;
  } catch (e) { if (odxLoc === loc) odxStatus(e.message, true); }
  renderOdx(); renderDtc();
}

function renderOdx() {
  const u = odxUnit, t = odxTable;
  let html = '';
  if (odxLoc && !u) html = `<div class="meta">Loading ${esc(odxLoc.label)}…</div>`;
  if (u) {
    html = `<h1>${esc(odxLoc.label)}</h1>
      <div class="meta">${esc([u.long_name, u.protocol, u.location, `${u.dtc_count} trouble codes`].filter(Boolean).join(' · '))}
        · <a href="#" onclick="showTab('dtc'); return false">show trouble codes</a></div>
      <div class="names">${u.tables.map(x => `<button class="${t && t.table === x.name ? 'on' : ''}" title="${esc(x.name)}"
        onclick="odxOpenTable('${esc(x.name)}')">${esc(x.long_name || x.name)} (${x.rows})</button>`).join('')}</div>`;
  }
  if (t && t.busy) html += `<div class="meta">Loading ${esc(t.table)}…</div>`;
  if (t && t.rows) {
    html += `<h2 class="sub">${esc(t.long_name || t.table)} <small class="meta">${t.count} rows</small></h2>
      <input type="text" placeholder="Filter rows" oninput="filterRows(this)">
      <table class="vals"><tr><th>Name</th><th>Identifier</th><th>Values</th></tr>${t.rows.map(r => `<tr>
        <td>${esc(r.long_name || r.name)}</td><td class="mono">${esc(r.name)}</td>
        <td>${r.params.map(p => `<div>${esc(p.long_name || p.name)}${p.unit ? ` [${esc(p.unit)}]` : ''}${p.choices && p.choices.length
          ? `: <span class="meta">${p.choices.map(esc).join(' · ')}</span>` : ''}</div>`).join('')}</td></tr>`).join('')}</table>`;
  }
  $('#odxBody').innerHTML = html;
}

async function odxOpenTable(name) {
  const loc = odxLoc;
  odxTable = {table: name, busy: true}; renderOdx();
  try {
    const res = await bridge({action: 'odx_table', table: name, ...loc.cmd});
    if (odxLoc === loc) odxTable = res;
  } catch (e) { if (odxLoc === loc) { odxTable = null; odxStatus(e.message, true); } }
  if (odxLoc === loc) renderOdx();
}

function renderDtc() {
  let html = '';
  if (odxLoc && !dtcList) html = `<div class="meta">Loading ${esc(odxLoc.label)}…</div>`;
  if (dtcList) {
    const real = dtcList.filter(d => d.code);
    // Each DTC expands to the same guidance as the units event memory: general (code-based) steps
    // and, on demand, ODIS guided fault finding. Guidance is built when a code is opened.
    html = `<h1>${esc(odxLoc.label)} <small class="meta">${real.length} trouble codes</small></h1>
      ${real.length ? '' : '<div class="meta">This data defines no trouble codes. Base data usually has none: pick a variant above.</div>'}
      <input type="text" placeholder="Search code or text, e.g. P0122 or throttle" oninput="filterDtc(this)">
      <div class="dtclist">${real.map((d, i) => `<details class="event" ontoggle="dtcFill(this)"
        data-code="${esc(d.code)}" data-text="${esc(d.text || '')}" data-idx="dtc${i}">
        <summary><span class="mono">${esc(d.code)}</span> ${esc(d.text || '')}
          <span class="meta">level ${d.level} · ${d.number} (0x${d.number.toString(16).toUpperCase()})</span></summary></details>`).join('')}</div>`;
  }
  $('#dtcBody').innerHTML = html;
}
// Fills a DTC's guidance the first time it is opened (the catalog can hold hundreds of codes).
function dtcFill(el) {
  if (el.open && !el.dataset.filled) {
    el.dataset.filled = '1';
    el.insertAdjacentHTML('beforeend', dtcGuidanceHTML(el.dataset.code, el.dataset.text, el.dataset.idx));
  }
}
function filterDtc(input) {
  const q = input.value.trim().toLowerCase();
  input.nextElementSibling.querySelectorAll('details').forEach(d => {
    d.hidden = q && !(d.querySelector('summary').textContent.toLowerCase().includes(q));
  });
}

// Hides the rows of the table following the filter input that do not contain its text.
function filterRows(input) {
  const q = input.value.trim().toLowerCase();
  input.nextElementSibling.querySelectorAll('tr').forEach((tr, i) => {
    if (i > 0) tr.hidden = q && !tr.textContent.toLowerCase().includes(q);
  });
}

// --- JSON viewer tab ---------------------------------------------------------------------

function jsonMsg(text, err) { const m = $('#jsonMsg'); m.textContent = text || ''; m.classList.toggle('err', !!err); }

function jsonParse() {
  try { return JSON.parse($('#jsonIn').value); } catch (e) { jsonMsg('Not valid JSON: ' + e.message, true); return undefined; }
}

async function jsonSend() {
  const cmd = jsonParse();
  if (cmd === undefined) return;
  if (!cmd || typeof cmd !== 'object' || !cmd.action) { jsonMsg('A bridge command is a JSON object with an "action".', true); return; }
  jsonMsg('Waiting for the bridge…');
  try { const res = await bridge(cmd); jsonMsg(`Reply to ${cmd.action}`); $('#jsonOut').innerHTML = jsonView(res); }
  catch (e) { jsonMsg(e.message, true); }
}

function jsonShow() {
  const v = jsonParse();
  if (v !== undefined) { jsonMsg('Pasted JSON'); $('#jsonOut').innerHTML = jsonView(v); }
}

function jsonLast() {
  if (!lastBridge) { jsonMsg('No bridge reply yet.', true); return; }
  $('#jsonIn').value = JSON.stringify(lastBridge.cmd, null, 2);
  jsonMsg(`Last reply: ${lastBridge.cmd.action}`);
  $('#jsonOut').innerHTML = jsonView(lastBridge.res);
}

// The sidebar's collapsed state is remembered per browser; it is only a convenience.
function toggleSide(collapse = !document.body.classList.contains('collapsed')) {
  document.body.classList.toggle('collapsed', collapse);
  $('#side').textContent = collapse ? '»' : '«';
  $('#side').title = collapse ? 'Show coding reads' : 'Hide coding reads';
  try { localStorage.setItem('sideCollapsed', collapse ? '1' : ''); } catch (e) {}
}

function toggle(i, bit) { work[i] ^= 1 << bit; render(); }
function setField(i, m, v) { work[i] = (work[i] & ~m) | v; render(); }
function copy(t) { navigator.clipboard.writeText(t); }

async function save(l, text) {
  const r = sel(); l.text = text.trim();
  try { await api('PUT', '/api/labels', {variant: r.variant, subsystem: r.subsystem, labels: [l]}); }
  catch (e) { alert('Saving label failed: ' + e.message); return; }
  labels = labels.filter(x => !(x.byte === l.byte && x.lo === l.lo && x.hi === l.hi && x.value === l.value));
  if (l.text) labels.push(l);
}

async function importLBL(input) {
  const r = sel(), file = input.files[0]; input.value = '';
  if (!r || !file) return;
  try {
    const n = await api('POST', '/api/labels/import?' + new URLSearchParams({variant: r.variant, subsystem: r.subsystem}), await file.text());
    await loadLabels(true); render();
    alert(`Imported ${n} labels from ${file.name} for ${r.variant}`);
  } catch (e) { alert('Import failed: ' + e.message); }
}

initDatabaseTabs();
let startTab = 'coding';
try { startTab = localStorage.getItem('tab') || 'coding'; } catch (e) {}
showTab(startTab);
try { toggleSide(localStorage.getItem('sideCollapsed') === '1'); } catch (e) { toggleSide(false); }
poll();
connPoll();
</script>
