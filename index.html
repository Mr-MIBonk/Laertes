<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laertes</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#dde1e7; --accent:#2563eb; --on:#16a34a; --chg:#d97706; --warn:#dc2626; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171c; --panel:#1d2128; --text:#e6e8eb; --muted:#9aa3ae; --line:#2e343d; --accent:#60a5fa; --on:#22c55e; --chg:#fbbf24; --warn:#f87171; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
aside { width:290px; border-right:1px solid var(--line); overflow:auto; background:var(--panel); flex-shrink:0; }
aside h2 { font-size:13px; text-transform:uppercase; color:var(--muted); margin:12px; }
.hist { padding:8px 12px; border-top:1px solid var(--line); cursor:pointer; }
.hist:hover { background:var(--bg); }
.hist.sel { border-left:3px solid var(--accent); background:var(--bg); }
.hist small { color:var(--muted); display:block; }
.hist { position:relative; }
.hist .del { position:absolute; top:6px; right:8px; padding:0 6px; }
aside h2 { display:flex; justify-content:space-between; align-items:center; }
aside h2 .del { text-transform:none; font-size:12px; padding:2px 8px; }
aside h2 span { flex:1; margin-left:8px; }
#side { padding:0 6px; }
body.collapsed aside { width:auto; }
body.collapsed aside h2 { margin:12px 6px; }
body.collapsed aside h2 > :not(#side), body.collapsed #hist { display:none; }
main { flex:1; overflow:auto; padding:16px 20px; }
h1 { font-size:18px; margin:0 0 4px; }
.meta { color:var(--muted); margin-bottom:12px; }
.notes { color:var(--muted); font-size:12px; margin:0 0 12px; padding-left:18px; }
.code { font-family:Consolas, monospace; font-size:15px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:4px 0 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.code > span { word-break:break-all; flex:1; }
.code .chg { color:var(--chg); font-weight:bold; }
.status { font:12px system-ui, sans-serif; color:var(--muted); flex-basis:100%; }
.status.err { color:var(--warn); }
button { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:4px; cursor:pointer; }
button.warn { border-color:var(--warn); color:var(--warn); }
table { border-collapse:collapse; background:var(--panel); width:100%; }
th, td { border:1px solid var(--line); padding:4px; vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:normal; }
td.b { font-family:Consolas, monospace; white-space:nowrap; text-align:center; }
td.f { min-width:220px; }
.bit { display:flex; flex-direction:column; gap:3px; min-width:90px; }
.bit label { display:flex; align-items:center; gap:4px; font-family:Consolas, monospace; cursor:pointer; }
.bit.on label { color:var(--on); font-weight:bold; }
.bit.chg label { color:var(--chg); }
.field { font-size:12px; margin-top:4px; }
.field.chg select { outline:2px solid var(--chg); }
select { width:100%; font:12px system-ui, sans-serif; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:3px; }
input[type=text] { width:100%; font:12px system-ui, sans-serif; padding:2px 4px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:3px; }
input[type=text]:focus { outline:1px solid var(--accent); }
.empty { color:var(--muted); margin-top:40px; text-align:center; }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:-4px 0 14px; }
.tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:6px 12px; color:var(--muted); }
.tabs button.on { border-bottom-color:var(--accent); color:var(--text); }
.tabs .brand { display:flex; align-items:center; gap:7px; padding-right:12px; margin-right:6px; border-right:1px solid var(--line); }
.tabs .brand .logo { width:28px; height:28px; color:var(--accent); flex-shrink:0; }
.tabs .brand .name { display:flex; flex-direction:column; line-height:1.05; font-weight:bold; font-size:15px; }
.tabs .brand .name small { font-weight:normal; font-size:10px; color:var(--muted); font-style:italic; }
.tabs .conn { margin-left:auto; display:flex; align-items:center; gap:6px; font:12px system-ui, sans-serif; color:var(--muted); padding:0 6px; cursor:default; }
.tabs .conn .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.tabs .conn.on .dot { background:var(--on); }
.tabs .conn.off { color:var(--warn); }
.tabs .conn.off .dot { background:var(--warn); }
.tabs .veh { display:flex; align-items:center; font:12px system-ui, sans-serif; color:var(--text); padding:0 6px; white-space:nowrap; }
.tabs .veh.off { color:var(--warn); }
.units { display:flex; gap:16px; align-items:flex-start; }
.units .list { flex:0 0 42%; min-width:0; overflow-x:auto; }
.units .bar label { white-space:nowrap; }
.units .bar, .db .bar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.units .bar input { max-width:260px; }
.units .bar button, .db .bar button { white-space:nowrap; }
.units .bar .status, .db .bar .status { flex-basis:auto; }
.units tbody.unit { cursor:pointer; }
.units tbody.unit.known td { color:var(--on); }
.units tbody.unit:hover td, .units tbody.unit.sel td { background:var(--bg); }
.units tbody.unit.sel tr:first-child td { font-weight:bold; }
.units tbody.unit tr.facts td { font:11px system-ui, sans-serif; color:var(--muted); white-space:normal; border-top:none; padding-top:0; }
.units tbody.unit tr:first-child td { border-bottom:none; }
.units td.small { font-size:11px; color:var(--muted); }
.units tbody.unit td.bad { color:var(--warn); font-weight:bold; }
.units .facts { font-size:12px; color:var(--muted); margin:2px 0 6px; }
.units .facts a { color:var(--accent); }
.units .names.short { max-height:150px; }
.warnbox { border:1px solid var(--chg); color:var(--chg); border-radius:4px; padding:6px 8px; margin:8px 0; font-size:13px; }
.units table.vals td.mono { font-family:Consolas, monospace; font-size:12px; color:var(--muted); white-space:nowrap; }
.units details.event { border:1px solid var(--line); border-radius:4px; margin:4px 0; background:var(--panel); }
.units details.event > summary { cursor:pointer; padding:5px 8px; }
.units details.event .mono { font-family:Consolas, monospace; font-weight:bold; }
.units details.event .bad { color:var(--warn); font-weight:bold; margin-left:6px; }
.units details.event .meta { margin-left:6px; }
.units details.event table.vals { margin:0 0 4px; }
.units td { font-family:Consolas, monospace; font-size:13px; white-space:nowrap; }
.units .detail { flex:1; min-width:0; position:sticky; top:0; }
.units .detail .acts { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.units .names, .db .names { display:flex; flex-wrap:wrap; gap:4px; max-height:70vh; overflow:auto; margin-top:6px; }
.units .names button, .units .names span, .db .names button { font:12px Consolas, monospace; padding:2px 6px; }
.units .status a, .db .meta a { color:var(--accent); }
.units .detail > input { margin-top:6px; }
.units table.vals td, .db table.vals td { font-family:system-ui, sans-serif; white-space:normal; }
.units table.vals th, .db table.vals th { text-align:left; color:var(--text); font-weight:bold; background:var(--bg); }
.units table.vals tr.err td { color:var(--warn); }
.names button.on { border-color:var(--accent); color:var(--accent); font-weight:bold; }
.units .names.check { flex-direction:column; flex-wrap:nowrap; gap:1px; max-height:60vh; }
.units .names.check label { display:flex; gap:6px; align-items:center; font:12px system-ui, sans-serif; padding:1px 0; }
.units table.vals tr.changed td { color:var(--chg); font-weight:bold; }
.units .byteedit { display:flex; flex-wrap:wrap; gap:3px; margin:4px 0; }
.units .byteedit input { width:2.6em; font:13px Consolas, monospace; text-align:center; text-transform:uppercase; padding:3px 0; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:3px; }
.units .byteedit input.chg { border-color:var(--chg); color:var(--chg); font-weight:bold; }
.units .mono { font-family:Consolas, monospace; }
.units table.vals select, .units table.vals input.num { font:12px system-ui, sans-serif; max-width:260px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:3px; padding:2px; }
.units table.vals input.num { width:7em; }
.units .guide { margin:8px 0 2px; padding:8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); }
.units .guide ul { margin:4px 0 8px; padding-left:18px; }
.units .guide li { margin:2px 0; }
.units table.vals td.sparkcell { padding:1px 4px; width:94px; }
.units svg.spark { display:block; }
.units svg.spark polyline { fill:none; stroke:var(--accent); stroke-width:1; vector-effect:non-scaling-stroke; }
.db .bar input.wide { max-width:520px; }
.db .names { max-height:30vh; }
.db h2.sub, .units h2.sub { font-size:15px; margin:16px 0 6px; }
.db td.mono { font-family:Consolas, monospace; white-space:nowrap; }
.db #odxBody > input, .db #dtcBody > input, .db .found > input { margin:8px 0 4px; max-width:420px; }
#jsonIn { width:100%; font:13px Consolas, monospace; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; margin:6px 0; }
.units details.rawjson { margin-top:8px; font-size:12px; color:var(--muted); }
.json { font:12px Consolas, monospace; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-height:70vh; overflow:auto; position:relative; }
.json > button { position:sticky; top:0; float:right; font-size:11px; padding:1px 6px; }
.json details { margin-left:14px; }
.json > details { margin-left:0; }
.json summary { cursor:pointer; margin-left:-14px; list-style-position:inside; }
.json .leaf { margin-left:0; white-space:pre-wrap; word-break:break-all; }
.json .k { color:var(--accent); }
.json .t { color:var(--muted); }
.json .s { color:var(--on); }
.json .d, .json .b { color:var(--chg); }
.json .n { color:var(--muted); font-style:italic; }
.units pre { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; font-size:12px; overflow:auto; max-height:70vh; white-space:pre-wrap; word-break:break-all; margin:0; }
</style>
</head>
<body>
<aside><h2><button id="side" onclick="toggleSide()"></button><span>Coding reads</span><button class="del" onclick="deleteReading(0)">Clear all</button></h2><div id="hist"></div></aside>
<main>
<nav class="tabs"><span class="brand" title="Laertes — father of Odis">
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="currentColor" d="M24 12 L32 36 L27.5 36 L24 25 L20.5 36 L16 36 Z"/>
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 40 C7 35 5 25 8 15"/><path d="M33 40 C41 35 43 25 40 15"/></g>
    <g fill="currentColor">
      <ellipse cx="7" cy="18" rx="3" ry="1.5" transform="rotate(-50 7 18)"/><ellipse cx="7" cy="25" rx="3" ry="1.5" transform="rotate(-25 7 25)"/><ellipse cx="9" cy="31" rx="3" ry="1.5"/><ellipse cx="13" cy="37" rx="3" ry="1.5" transform="rotate(32 13 37)"/>
      <ellipse cx="41" cy="18" rx="3" ry="1.5" transform="rotate(50 41 18)"/><ellipse cx="41" cy="25" rx="3" ry="1.5" transform="rotate(25 41 25)"/><ellipse cx="39" cy="31" rx="3" ry="1.5"/><ellipse cx="35" cy="37" rx="3" ry="1.5" transform="rotate(-32 35 37)"/>
    </g>
  </svg>
  <span class="name">Laertes<small>father of Odis</small></span></span>
  <button data-tab="units" onclick="showTab('units')">Project units</button><button data-tab="odx" onclick="showTab('odx')">Unit database</button><button data-tab="dtc" onclick="showTab('dtc')">Trouble codes</button><button data-tab="coding" onclick="showTab('coding')">Coding</button><button data-tab="history" onclick="showTab('history')">History</button><button data-tab="json" onclick="showTab('json')">JSON viewer</button>
  <span id="conn" class="conn wait"><span class="dot"></span><span class="txt">ODIS bridge…</span></span>
  <span id="veh" class="veh" hidden></span>
  <span id="vci" class="veh" hidden></span></nav>
<div id="main"></div>
<div id="units" class="units" hidden>
  <div class="list">
    <div class="bar"><input type="text" id="unitFilter" placeholder="Filter by address or name" oninput="renderUnitList()">
      <label><input type="checkbox" id="unitIdentified" onchange="renderUnitList()"> identified only</label>
      <button onclick="loadUnits()">Reload from ODIS</button><span class="status" id="unitsMsg"></span></div>
    <table class="unitlist"><thead><tr><th>Address</th><th>Unit</th><th>State</th><th>DTCs</th></tr></thead><tbody id="unitRows"></tbody></table>
  </div>
  <div class="detail" id="unitDetail"></div>
</div>
<div id="odx" class="db" hidden></div>
<div id="dtc" class="db" hidden></div>
<div id="history" class="db units" hidden></div>
<div id="json" class="db" hidden>
  <div class="meta">Send a command to the ODIS bridge, or paste any JSON to read it as a tree.</div>
  <textarea id="jsonIn" rows="5" spellcheck="false">{"action": "ping"}</textarea>
  <div class="bar"><button onclick="jsonSend()">Send to bridge</button><button onclick="jsonShow()">View pasted JSON</button>
    <button onclick="jsonLast()">Last bridge reply</button><span class="status" id="jsonMsg"></span></div>
  <div id="jsonOut"></div>
</div>
</main>
<input type="file" id="lbl" accept=".lbl,.txt" hidden onchange="importLBL(this)">
<input type="file" id="unitlbl" accept=".lbl,.txt" hidden onchange="onUnitLBL(this)">
<script>
let readings = [], selId = null, maxId = 0, work = [], labels = [], labelsKey = '';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex = b => b.toString(16).toUpperCase().padStart(2, '0');
const bytesOf = h => h.match(/../g).map(x => parseInt(x, 16));
let virtualReading = null;  // a live unit's coding opened in the Coding tab (not a log reading)
const sel = () => virtualReading || readings.find(r => r.id === selId);
const fmtTime = t => t.length >= 21 ? `${t.slice(6,8)}.${t.slice(4,6)}.${t.slice(0,4)} ${t.slice(9,17)}.${t.slice(18,21)}` : t;
const mask = (lo, hi) => ((0xFF >> (7 - hi)) & (0xFF << lo)) & 0xFF;
const label = (byte, lo, hi, value) => labels.find(l => l.byte === byte && l.lo === lo && l.hi === hi && l.value === value);

async function api(method, url, body) {
  const res = await fetch(url, {method, body: typeof body === 'string' ? body : JSON.stringify(body)});
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function poll() {
  try {
    readings = await api('GET', '/api/readings');
    const newest = readings.length ? readings[0].id : 0;
    if (virtualReading) { if (newest > maxId) maxId = newest; renderHist(); }  // keep the live coding in view
    else if (newest > maxId) { maxId = newest; await select(newest); }  // follow ODIS automatically
    else if (!sel()) await select(newest);  // selected reading was deleted
    else renderHist();
  } catch (e) {}
  setTimeout(poll, 1000);
}

// Bridge connection indicator: pings the ODIS bridge (mcpserver_test.py) so a lost connection
// shows in the top bar without having to run a command. ping goes through /api/bridge directly,
// not through bridge(), to avoid overwriting the "Last bridge reply" of the JSON viewer.
async function pingBridge() {
  const el = $('#conn'), txt = el.querySelector('.txt'), veh = $('#veh');
  try {
    await api('POST', '/api/bridge', {action: 'ping'});
    el.className = 'conn on'; txt.textContent = 'ODIS bridge'; el.title = 'Connected to the ODIS bridge (mcpserver_test.py).';
    try {
      const v = await api('POST', '/api/bridge', {action: 'vehicle'});
      veh.hidden = false; veh.textContent = v.project ? '🚗 ' + v.project : 'no vehicle';
      veh.title = v.project ? 'Vehicle project loaded in ODIS' : 'No vehicle project loaded in ODIS';
    } catch (e) { veh.hidden = true; }
    try {
      const vci = $('#vci'), c = await api('POST', '/api/bridge', {action: 'vci'});
      const state = (c.state || '').toLowerCase(), on = state === 'connected' || state === 'on';
      vci.hidden = false; vci.textContent = '🔌 VCI ' + (c.state || '?');
      vci.classList.toggle('off', !on);
      vci.title = `VCI ${c.state || '?'}${c.clamp15 ? ' · clamp 15 ' + c.clamp15 : ''}${c.clamp30 ? ' · clamp 30 ' + c.clamp30 : ''}${(c.doip && c.doip.length) ? ' · DoIP: ' + c.doip.join(', ') : ''}`;
    } catch (e) { $('#vci').hidden = true; }
  } catch (e) {
    el.className = 'conn off'; txt.textContent = 'ODIS bridge offline'; el.title = e.message;
    veh.hidden = true; $('#vci').hidden = true;
  }
}
async function connPoll() { await pingBridge(); setTimeout(connPoll, 5000); }

async function loadLabels(force) {
  const r = sel(), key = r.variant + '\n' + r.subsystem;
  if (key === labelsKey && !force) return;
  labels = await api('GET', '/api/labels?' + new URLSearchParams({variant: r.variant, subsystem: r.subsystem}));
  labelsKey = key;
}

async function select(id) {
  virtualReading = null;  // choosing a log reading leaves the live-coding view
  selId = id;
  if (!sel()) {
    selId = null; renderHist();
    $('#main').innerHTML = '<div class="empty">Waiting for ODIS… open <b>Coding</b> on a control unit.</div>';
    return;
  }
  work = bytesOf(sel().coding);
  await loadLabels();
  renderHist(); render();
}

function renderHist() {
  $('#hist').innerHTML = readings.map(r => `<div class="hist ${r.id === selId ? 'sel' : ''}" onclick="select(${r.id})">
    <button class="del" title="Delete this reading" onclick="event.stopPropagation(); deleteReading(${r.id})">✕</button>
    <b>${esc(r.ecu || r.subsystem)}</b><small>${esc(r.variant)}</small><small>${fmtTime(r.time)} · ${r.coding.length / 2} bytes</small></div>`).join('');
}

// Bit fields of one byte: [{lo, hi, options:[{value,text}]}], from the VCDS-style range labels.
function fields(i) {
  const fs = {};
  labels.filter(l => l.byte === i && l.value >= 0).forEach(l => {
    const k = l.lo + '~' + l.hi;
    (fs[k] = fs[k] || {lo: l.lo, hi: l.hi, options: []}).options.push(l);
  });
  return Object.values(fs);
}

function render() {
  const r = sel(), orig = bytesOf(r.coding);
  const newHex = work.map((b, i) => b !== orig[i] ? `<span class="chg">${hex(b)}</span>` : hex(b)).join('');
  const notes = labels.filter(l => l.byte === -1).sort((a, b) => a.lo - b.lo);
  let rows = '';
  work.forEach((b, i) => {
    let cells = '';
    for (let bit = 7; bit >= 0; bit--) {
      const on = (b >> bit) & 1, changed = on !== ((orig[i] >> bit) & 1), l = label(i, bit, bit, -1);
      cells += `<td><div class="bit ${on ? 'on' : ''} ${changed ? 'chg' : ''}">
        <label><input type="checkbox" ${on ? 'checked' : ''} onchange="toggle(${i},${bit})"> bit ${bit}</label>
        <input type="text" value="${esc(l ? l.text : '')}" onchange="save({byte:${i},lo:${bit},hi:${bit},value:-1}, this.value)"></div></td>`;
    }
    const fieldHTML = fields(i).map(f => {
      const m = mask(f.lo, f.hi), cur = b & m, known = f.options.some(o => o.value === cur);
      return `<div class="field ${cur !== (orig[i] & m) ? 'chg' : ''}">Bits ${f.lo}–${f.hi}
        <select onchange="setField(${i},${m},+this.value)">${known ? '' : `<option selected value="${cur}">0x${hex(cur)} (unknown)</option>`}
        ${f.options.map(o => `<option value="${o.value}" ${o.value === cur ? 'selected' : ''}>0x${hex(o.value)} ${esc(o.text)}</option>`).join('')}</select></div>`;
    }).join('');
    const bl = label(i, 0, 7, -1);
    rows += `<tr><td class="b">Byte ${i}<br>${hex(b)}${b !== orig[i] ? ` <small>(was ${hex(orig[i])})</small>` : ''}<br>${b.toString(2).padStart(8, '0')}</td>
      <td class="f"><input type="text" placeholder="byte label" value="${esc(bl ? bl.text : '')}" onchange="save({byte:${i},lo:0,hi:7,value:-1}, this.value)">${fieldHTML}</td>${cells}</tr>`;
  });
  const changed = work.some((b, i) => b !== orig[i]);
  $('#main').innerHTML = `<h1>${esc(r.ecu || r.subsystem)}</h1>
    <div class="meta">${esc(r.variant)} · ${esc(r.subsystem)} · coding opened ${fmtTime(r.time)}
      · <button onclick="$('#lbl').click()">Import .lbl labels</button></div>
    ${notes.length ? `<ul class="notes">${notes.map(n => `<li>${esc(n.text)}</li>`).join('')}</ul>` : ''}
    Original coding<div class="code"><span>${r.coding}</span><button onclick="copy('${r.coding}')">Copy</button></div>
    New coding<div class="code"><span>${newHex}</span><button onclick="copy(work.map(hex).join(''))">Copy</button><button onclick="select(selId)">Reset</button>
      <span class="meta">To write to a unit, open it under Project units.</span></div>
    <table><tr><th>Byte</th><th>Byte label / bit fields</th>${[7,6,5,4,3,2,1,0].map(b => `<th>Bit ${b} (0x${hex(1 << b)})</th>`).join('')}</tr>${rows}</table>`;
}

async function deleteReading(id) {
  if (!confirm(id ? 'Delete this reading?' : 'Delete all readings? Labels are kept.')) return;
  try { await api('DELETE', '/api/readings' + (id ? '/' + id : '')); } catch (e) { alert('Delete failed: ' + e.message); return; }
  readings = await api('GET', '/api/readings');
  if (!sel()) await select(readings.length ? readings[0].id : null); else renderHist();
}

// Project units come from the ODIS Jython bridge (mcpserver_test.py) through /api/bridge.
// Unit actions connect to the control unit by its address; list results drill down further.
let units = null, unitSel = null, unitPath = [];
const UNIT_ACTIONS = [
  [{action: 'read_identification'}, 'Identification'],
  [{action: 'read_coding'}, 'Coding'],
  [{action: 'list_adaptation_channels'}, 'Adaptation channels'],
  [{action: 'list_measurement_groups'}, 'Measurement groups'],
  [{action: 'read_event_memory'}, 'Event memory'],
];
// For list results: the command and label opened by clicking one of the names.
const UNIT_NEXT = {
  list_adaptation_channels: (name) => [{action: 'read_adaptation', channel: name}, name],
  list_measurement_groups: (name) => [{action: 'read_measurement_group', group: name}, name],
};

// Table rows for the values in a bridge result: every ODIS value (translatedName/translatedValue),
// coding, set DTC status bit and error, in document order, with a heading per result entry.
function resultRows(v, rows = [], depth = 0) {
  if (Array.isArray(v)) { v.forEach(x => resultRows(x, rows, depth)); return rows; }
  if (!v || typeof v !== 'object') return rows;
  if ('translatedValue' in v) {
    const name = v.translatedName && v.translatedName !== '---' ? v.translatedName : v.name;
    rows.push({depth, name, value: v.translatedValue, unit: v.unit});
    (v.children || []).forEach(c => resultRows(c, rows, depth + 1));
    return rows;
  }
  if ('bitValueText' in v) { if (v.bitSet) rows.push({depth, name: `Status bit ${v.bitPosition}`, value: v.bitValueText}); return rows; }
  if (v.tableKeyText) rows.push({head: v.tableKeyText});
  else if (/EventMemoryEntry/.test(v._type || '')) rows.push({head: 'Event memory entry'});
  if ('byteCoding' in v) {
    rows.push({depth, name: `Byte coding (${v.systemName})`, value: v.byteCoding});
    for (const [k, x] of Object.entries(v.textCoding || {})) if (x === null || typeof x !== 'object') rows.push({depth: depth + 1, name: k, value: x});
  }
  if (v.negativeResult && v.negativeResult.negativeResponse) rows.push({depth, name: 'Negative response', value: v.negativeResult.translatedMessage, err: true});
  if (v.errorMessage || v.error) rows.push({depth, name: 'Error', value: v.errorMessage || v.error, err: true});
  for (const [k, x] of Object.entries(v)) if (!['parent', 'negativeResult', 'error'].includes(k)) resultRows(x, rows, depth);
  return rows;
}

// Each tab shows the element with the id in TABS; the coding view lives in #main.
const TABS = {coding: 'main', units: 'units', odx: 'odx', dtc: 'dtc', history: 'history', json: 'json'};
let activeTab = 'coding';
const currentTab = () => activeTab;
function showTab(tab) {
  if (!TABS[tab]) tab = 'coding';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  for (const [t, id] of Object.entries(TABS)) $('#' + id).hidden = t !== tab;
  $('aside').hidden = tab !== 'coding';  // coding reads belong to the coding view
  try { localStorage.setItem('tab', tab); } catch (e) {}
  activeTab = tab;
  stopLive();  // a live measurement view only updates while the units tab shows it
  if (tab === 'units' && !units) loadUnits();
  if (tab === 'history') loadHistory();
}

// The bridge describes a unit only by its toString(), e.g.
// "id[0x0001] sname[EnginContrModul1] prot[id[0] name[UNKNOWN] prio[0]] hwver[---] ...".
function reprFields(repr) {
  const f = {};
  for (const [, k, v] of repr.matchAll(/(\w+)\[([^\[\]]*)\]/g)) if (!(k in f)) f[k] = v;
  return f;
}

function unitsStatus(text, err) { const m = $('#unitsMsg'); m.textContent = text || ''; m.classList.toggle('err', !!err); }

// Units of the current ODIS session vehicle, with what ODIS identified (part numbers, versions,
// ODX variant); without a vehicle session, the plain project plan.
async function loadUnits() {
  unitsStatus('Loading units from ODIS…');
  try {
    let res, source = 'session vehicle';
    try { res = await bridge({action: 'list_vehicle_ecus'}); }
    catch (e) { res = await bridge({action: 'list_project_ecus', include_methods: false}); source = 'ODIS project'; }
    units = res.ecus.map((e, i) => ({index: i, repr: e.repr, ...reprFields(e.repr), state: e.read_state || '',
        variant: e.odx_variant || '', system: (e.system_name && e.system_name.identification || '').trim(),
        dtcs: e.dtc_count === undefined ? null : e.dtc_count}))
      .sort((a, b) => (parseInt(a.id, 16) || 0) - (parseInt(b.id, 16) || 0));
    const known = units.filter(u => u.state && u.state !== 'NOT_READ' && u.swpnr && u.swpnr !== '---').length;
    unitsStatus(`${units.length} units from the ${source}, ${known} identified`);
  } catch (e) { units = units || []; unitsStatus(e.message, true); }
  renderUnitList(); renderUnitDetail();
}

const known = v => v && v !== '---' ? v : '';

// One line of what ODIS identified about a unit: system · protocol · HW · SW · ODX variant.
function unitFacts(u) {
  return [known(u.system), known(u.name) !== 'UNKNOWN' && known(u.name),
    known(u.hwpnr) && `HW ${u.hwpnr} ${known(u.hwver)}`, known(u.swpnr) && `SW ${u.swpnr} ${known(u.swver)}`,
    u.variant].filter(Boolean).map(esc).join(' · ');
}

// Each unit takes two table rows: address, name, state and DTC count, then its identification
// in small text, which keeps the list narrow next to the detail pane.
function renderUnitList() {
  const q = $('#unitFilter').value.trim().toLowerCase(), onlyKnown = $('#unitIdentified').checked;
  const table = $('table.unitlist');
  table.querySelectorAll('tbody.unit').forEach(b => b.remove());
  const rows = (units || [])
    .filter(u => (!q || (u.repr + ' ' + u.system + ' ' + u.variant).toLowerCase().includes(q)) && (!onlyKnown || known(u.swpnr)))
    .map(u => {
      const facts = unitFacts(u);
      return `<tbody class="unit ${u.index === unitSel ? 'sel' : ''} ${known(u.swpnr) ? 'known' : ''}" onclick="selectUnit(${u.index})">
        <tr><td>${esc(u.id || '')}</td><td>${esc(u.sname || u.repr)}</td><td class="small">${esc(u.state)}</td>
          <td class="${u.dtcs ? 'bad' : ''}">${u.dtcs === null ? '' : u.dtcs}</td></tr>
        ${facts ? `<tr class="facts"><td></td><td colspan="3">${facts}</td></tr>` : ''}</tbody>`;
    }).join('');
  table.insertAdjacentHTML('beforeend', rows);
}

function selectUnit(index) { unitSel = index; unitPath = []; renderUnitList(); renderUnitDetail(); }

function valsTable(rows) {
  return `<table class="vals">${rows.map(r => r.head ? `<tr><th colspan="3">${esc(r.head)}</th></tr>`
    : `<tr class="${r.err ? 'err' : ''}"><td style="padding-left:${4 + 14 * r.depth}px">${esc(r.name)}</td><td>${esc(r.value)}</td><td>${esc(r.unit || '')}</td></tr>`).join('')}</table>`;
}

// Event memory: one collapsible block per stored fault. The summary shows the DTC, its text and
// whether it is active (status bit 0, test failed); opening it shows every set status bit, the
// other event details and the environment data.
function eventMemoryHTML(res) {
  const m = res.event_memory, entries = m.eventMemoryEntries || [];
  const blocks = entries.map((e, ei) => {
    const infos = e.eventInfos || [], info = t => infos.find(i => i.eventInfoType === t);
    const code = (info('PCODE') || {}).translatedValue || '', err = info('ERROR_CODE') || {};
    const text = err.translatedValue || (err.translatedName || '').replace(/\s+/g, ' ');
    const bits = (e.dtcStates || []).filter(b => b.bitSet), active = bits.some(b => b.bitPosition === 0);
    const rows = [...bits.map(b => ({depth: 0, name: `Status bit ${b.bitPosition}`, value: b.bitValueText})),
      ...resultRows(infos.filter(i => !['PCODE', 'ERROR_CODE'].includes(i.eventInfoType) && i.translatedValue)),
      ...resultRows(e.environmentData)];
    return `<details class="event"><summary><span class="mono">${esc(code || '—')}</span> ${esc(text)}
      <span class="${active ? 'bad' : 'meta'}">${active ? 'active' : 'passive'}</span></summary>${valsTable(rows)}${dtcGuidanceHTML(code, text, ei)}</details>`;
  }).join('');
  return `<div class="meta">${res.cleared ? 'Event memory cleared. ' : ''}${entries.length} stored fault${entries.length === 1 ? '' : 's'}</div>
    ${m.errorMessage ? `<div class="status err">${esc(m.errorMessage)}</div>` : ''}${blocks}`;
}

// General repair guidance for a DTC, derived from its standardised OBD-II code structure and
// fault text. This is generic methodology, not ODIS's vehicle-specific guided fault finding;
// the button fetches the latter when a guided-diagnosis session is active in ODIS.
function dtcGuidance(code, text) {
  const t = (text || '').toLowerCase(), steps = [];
  if (/low input|circ.*low|short to ground/.test(t)) steps.push('“Low input”: measure the signal wire — suspect a short to ground or an open supply/signal line. Inspect the connector and pins for corrosion or spread terminals.');
  if (/high input|circ.*high|short to.*(b\+|positive|power)/.test(t)) steps.push('“High input”: suspect a short to power or a missing ground. Back-probe the component’s supply and ground.');
  if (/\bcircuit\b|open circuit/.test(t) && !/low|high/.test(t)) steps.push('“Circuit” fault: check wiring continuity and the connector between the control unit and the component.');
  if (/range\/performance|implausible|plausib|correlation|signal/.test(t)) steps.push('“Range/performance” or correlation: the signal is present but implausible — compare related sensors in live measurements and check for a mechanical cause.');
  if (/intermittent|sporadic/.test(t)) steps.push('Intermittent: wiggle-test the harness and connector while watching the live value; inspect the component grounds.');
  const m = /P([0-3])[0-9]([0-9A-F])[0-9A-F]/i.exec(code || '');
  if (m) {
    const sys = {'1': 'fuel / air metering', '2': 'fuel / air injector circuit', '3': 'ignition system or misfire', '4': 'auxiliary emission controls', '5': 'vehicle speed, idle control or auxiliary inputs', '6': 'control module or its outputs', '7': 'transmission', '8': 'transmission'}[m[2]];
    if (sys) steps.push(`Code area: ${sys}. Inspect the related component, its wiring and connector; verify supply and ground.`);
    if (m[1] === '1' || m[1] === '3') steps.push('Manufacturer-specific (P1/P3) code — use the ODIS guided test or workshop manual for the exact procedure.');
  }
  steps.push('Use the freeze-frame data above (speed, load, temperatures, voltage) to reproduce the conditions, then clear the code and check whether it returns.');
  return steps;
}
function dtcGuidanceHTML(code, text, idx) {
  return `<div class="guide"><b>General guidance</b> <span class="meta">(generic, not ODIS guided fault finding)</span>
    <ul>${dtcGuidance(code, text).map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <button onclick="odisGuidance('${esc(code)}', '${idx}')">ODIS guided guidance${code ? ' for ' + esc(code) : ''}</button>
    <div id="guide${idx}" class="meta"></div></div>`;
}
async function odisGuidance(code, idx) {
  const el = document.getElementById('guide' + idx); if (!el) return;
  el.textContent = 'Asking ODIS…';
  try {
    const res = await bridge({action: 'fault_guidance', query: code});
    const docs = res.documents || [], objs = res.diagnostic_objects || [];
    if (docs.length || objs.length) {
      el.innerHTML = `${docs.length ? `<b>Documents</b><ul>${docs.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${objs.length ? `<b>Diagnostic objects</b><ul>${objs.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}`;
      return;
    }
    // No guided data: guided fault finding needs the vehicle identified. Show the detected
    // project and, when ODIS allows it (no project loaded), let the user set the car.
    const vp = await bridge({action: 'vehicle_projects'}).catch(() => ({}));
    el.innerHTML = `ODIS has no guided documents yet — guided fault finding needs the vehicle identified and started in ODIS.
      <div class="meta">Detected vehicle project: <b>${esc(vp.current || 'none')}</b>${vp.change_allowed === false ? ' · locked (change it in ODIS)' : ''}</div>
      ${vp.change_allowed ? `<div class="bar"><input id="vp${idx}" placeholder="vehicle project, e.g. VW37X" value="${esc(vp.current || '')}">
        <button onclick="setVehicle('${idx}', '${esc(code)}')">Set vehicle & retry</button></div>`
        : '<div class="meta">In ODIS: identify the vehicle (or pick it manually) and open Guided Fault Finding, then retry.</div>'}`;
  } catch (e) { el.textContent = e.message; }
}
async function setVehicle(idx, code) {
  const input = document.getElementById('vp' + idx), v = input && input.value.trim();
  if (!v) return;
  const el = document.getElementById('guide' + idx);
  el.textContent = 'Setting vehicle project…';
  try {
    const res = await bridge({action: 'set_vehicle_project', project: v});
    el.textContent = `Vehicle project set to ${res.project} (${res.ecu_count} ECUs). Retrying guidance…`;
    odisGuidance(code, idx);
  } catch (e) { el.textContent = e.message; }
}

function renderUnitDetail() {
  const u = (units || []).find(u => u.index === unitSel);
  if (!u) { $('#unitDetail').innerHTML = '<div class="empty">Select a unit.</div>'; return; }
  const step = unitPath[unitPath.length - 1];
  let body = '';
  if (step && step.live) {
    body = liveHTML(step);
  } else if (step && step.res && step.res.names && step.cmd.action === 'list_measurement_groups') {
    body = `<div class="bar"><button onclick="liveStart()">Show live</button>
        <button onclick="measSelectAll(true)">All</button><button onclick="measSelectAll(false)">None</button>
        <span class="meta">Tick groups to watch, then Show live.</span></div>
      <input type="text" placeholder="Filter" oninput="filterNames(this)">
      <div class="names check">${step.res.names.map((n, i) =>
        `<label><input type="checkbox" class="measpick" value="${i}"> ${esc(n)}</label>`).join('')}</div>`;
  } else if (step && step.res && step.res.names) {
    const next = UNIT_NEXT[step.cmd.action];
    body = `<input type="text" placeholder="Filter" oninput="filterNames(this)">
      <div class="names">${step.res.names.map((n, i) => next
      ? `<button onclick="unitOpen(${i})">${esc(n)}</button>` : `<span>${esc(n)}</span>`).join('')}</div>`;
  } else if (step && step.res && step.res.event_memory) {
    body = eventMemoryHTML(step.res) + `<details class="rawjson"><summary>JSON</summary>${jsonView(step.res)}</details>`;
  } else if (step && step.res) {
    const rows = resultRows(step.res);
    // Method lists are the same long Java reflection dump for every object; show only their size.
    const data = JSON.parse(JSON.stringify(step.res, (k, v) => k === 'methods' && Array.isArray(v) ? `(${v.length} methods)` : v));
    body = rows.length ? `${valsTable(rows)}
        <details class="rawjson"><summary>JSON</summary>${jsonView(data)}</details>`
      : jsonView(data);
    if (step.cmd.action === 'read_coding')
      body += codingEditorHTML(step)
        + `<h2 class="sub">Coding definition (ODIS database)</h2>${codingDefinitionHTML(step)}`
        + `<h2 class="sub">Decode with your .lbl labels</h2>${lblDecodeHTML(step)}`;
    if (step.cmd.action === 'read_adaptation')
      body += adaptationEditorHTML(step);
  }
  const crumbs = unitPath.map((s, i) => i === unitPath.length - 1 ? esc(s.label) : `<a href="#" onclick="unitBack(${i}); return false">${esc(s.label)}</a>`).join(' › ');
  $('#unitDetail').innerHTML = `<h1>${esc(u.sname || '')} <small class="meta">${esc(u.id || '')}</small></h1>
    <div class="facts">${unitFacts(u) || esc(u.state)} · <a href="#" onclick="openInDatabase(); return false">open in unit database</a>
      · <a href="#" onclick="openDtcCatalog(); return false">DTC catalog (offline)</a></div>
    <div class="acts">${UNIT_ACTIONS.map(([, label], i) => `<button onclick="unitStart(${i})">${esc(label)}</button>`).join('')}
      <button onclick="unitLogin()">Login…</button>
      <button class="warn" onclick="unitClearDtcs()">Clear DTCs</button></div>
    ${step ? `<div class="status ${step.err ? 'err' : ''}">${crumbs}${step.busy ? ' …' : ''}${step.err ? ': ' + esc(step.err) : ''}
      ${step.res && step.res.names ? ` (${step.res.names.length})` : ''}</div>${body}` : ''}`;
}

// Textual coding from the ODIS database ("Record Data Identifier Variant Coding Writable Textual"),
// used to decode the live byte coding of a unit. When the unit's own ODX variant defines none, a
// definition of a related variant (same unit family) can be chosen instead, with a warning.
const TEXTUAL_TABLE = 'TAB_RecorDataIdentVariaCodinWritaTextu';

async function codingDefinition(u) {
  if (!u.variant) return {note: 'ODIS has not identified the ODX variant of this unit, so its database coding definition is unknown.', borrow: true};
  try {
    const res = await bridge({action: 'odx_table', variant: u.variant, table: TEXTUAL_TABLE});
    const params = res.rows.flatMap(r => r.params);
    if (params.length > 1) return {own: res};
    return {note: `Plain-text coding is disabled for ${u.variant} in the ODIS database: this unit is coded as bytes only.`, borrow: true};
  } catch (e) {
    return {note: `${u.variant} has no textual coding table in the ODIS database.`, borrow: true};
  }
}

// The coding step currently shown in the unit pane.
const codingStep = () => { const s = unitPath[unitPath.length - 1]; return s && s.cmd.action === 'read_coding' ? s : null; };

// Change history: every coding/adaptation write is saved to SQL (survives restart) and listed
// under the History tab.
let changes = null, vehicleVin;
async function getVin() {  // fetched once and cached; '' when ODIS does not know it
  if (vehicleVin !== undefined) return vehicleVin;
  try { vehicleVin = (await bridge({action: 'vin'})).vin || ''; } catch (e) { vehicleVin = ''; }
  return vehicleVin;
}
async function recordChange(c) {
  try {
    if (c.vin === undefined) c.vin = await getVin();
    await api('POST', '/api/history', c);
    changes = null;  // reload next time History is shown
    if (currentTab() === 'history') loadHistory();
  } catch (e) { /* recording is best-effort; the write itself already reported its result */ }
}
async function loadHistory() {
  try { changes = await api('GET', '/api/history'); } catch (e) { changes = []; }
  renderHistory();
}
// A local, human-readable date/time from the stored ISO timestamp.
const fmtWhen = t => { const d = new Date(t); return isNaN(d.getTime()) ? (t || '') : d.toLocaleString(); };
// Shows newValue with the tokens that differ from oldValue highlighted (byte or key=value tokens).
function diffNew(oldStr, newStr) {
  const o = String(oldStr || '').split(/(\s+)/);
  return String(newStr || '').split(/(\s+)/).map((tok, i) =>
    /^\s*$/.test(tok) ? tok : (tok !== (o[i] || '') ? `<span class="chg">${esc(tok)}</span>` : esc(tok))).join('');
}
function renderHistory() {
  const el = $('#history');
  if (!el) return;
  const cs = changes || [];
  const rows = cs.map(c => {
    const unit = [esc(c.unit || ''), c.address ? `<small class="meta">${esc(c.address)}</small>` : '',
      c.variant ? `<small class="meta">${esc(c.variant)}</small>` : '',
      c.vin ? `<small class="meta">VIN ${esc(c.vin)}</small>` : ''].filter(Boolean).join('<br>');
    return `<tr class="${c.status === 'error' || c.status === 'mismatch' ? 'err' : ''}">
      <td class="small">${esc(fmtWhen(c.time))}</td><td>${esc(c.kind)}</td>
      <td>${unit}</td><td>${esc(c.target || '')}</td>
      <td class="mono"><span class="meta">${esc(c.oldValue || '')}</span><br>${diffNew(c.oldValue, c.newValue)}</td>
      <td>${esc(c.status || '')}${c.note ? `<br><small class="meta">${esc(c.note)}</small>` : ''}</td>
      <td><button class="del" title="Delete" onclick="deleteChange(${c.id})">✕</button></td></tr>`;
  }).join('');
  el.innerHTML = `<div class="bar"><button onclick="loadHistory()">Reload</button>
      <button class="warn" onclick="deleteChange(0)">Clear all</button>
      <span class="meta">${cs.length} change${cs.length === 1 ? '' : 's'} written to control units (stored in the database)</span></div>
    ${cs.length ? `<table class="vals"><tr><th>Time</th><th>Kind</th><th>Unit</th><th>Target</th><th>Old → New</th><th>Status</th><th></th></tr>${rows}</table>`
      : '<div class="empty">No coding or adaptation changes recorded yet.</div>'}`;
}
async function deleteChange(id) {
  if (!confirm(id ? 'Delete this history entry?' : 'Clear all change history?')) return;
  try { await api('DELETE', '/api/history' + (id ? '/' + id : '')); } catch (e) { alert('Delete failed: ' + e.message); return; }
  loadHistory();
}

// --- Units coding editor: edit the byte coding and write it to the unit via the bridge ------
function codingEditorHTML(step) {
  if (!step.work || !step.work.length) return '';
  const changed = step.work.some((b, i) => b !== step.orig[i]);
  const newHex = step.work.map((b, i) => b !== step.orig[i] ? `<span class="chg">${hex(b)}</span>` : hex(b)).join(' ');
  const inputs = step.work.map((b, i) =>
    `<input class="${b !== step.orig[i] ? 'chg' : ''}" maxlength="2" value="${hex(b)}" title="Byte ${i}" onchange="codingByte(${i}, this.value)">`).join('');
  return `<h2 class="sub">Edit coding (${esc(step.sysName)})</h2>
    <div class="meta">Original <span class="mono">${step.orig.map(hex).join(' ')}</span></div>
    <div class="byteedit">${inputs}</div>
    <div class="code"><span class="mono">${newHex}</span><button onclick="codingReset()">Reset</button>
      <button class="warn" ${changed ? '' : 'disabled'} onclick="codingWrite()">Write to unit…</button>
      <button onclick="openUnitCodingInTab()" title="Open this coding in the Coding tab for the full bit grid and label editing">Open in Coding tab</button>
      ${step.writeMsg ? `<div class="status ${step.writeErr ? 'err' : ''}">${esc(step.writeMsg)}</div>` : ''}</div>`;
}
function codingByte(i, v) {
  const step = codingStep(); if (!step) return;
  const b = parseInt(v, 16);
  if (!isNaN(b) && b >= 0 && b <= 255) step.work[i] = b;
  renderUnitDetail();
}
function codingReset() { const s = codingStep(); if (s) { s.work = s.orig.slice(); s.writeMsg = ''; renderUnitDetail(); } }
// Opens the current unit coding in the Coding tab (full bit grid + label editing) as a live view.
async function openUnitCodingInTab() {
  const step = codingStep(), u = units.find(u => u.index === unitSel);
  if (!step || !step.work) return;
  virtualReading = {id: -1, time: '', ecu: u.sname || u.id || '', variant: step.unitVariant || '', subsystem: step.sysName || 'master', coding: step.work.map(hex).join('')};
  selId = -1; work = step.work.slice(); labelsKey = null;
  showTab('coding');
  await loadLabels(true);  // the unit's own .lbl labels (by variant/subsystem)
  // Also carry the coding definition chosen in units (own or borrowed ODX) as labels for the grid.
  const table = step.odx && step.odx.own ? step.odx.own : (step.borrow && step.borrow.table);
  if (table) labels = labels.concat(odxToLabels(table));
  renderHist(); render();
}
// Converts an ODX textual coding table into VCDS-style labels (per-byte bit fields) so the chosen
// definition shows in the Coding tab grid. Fields spanning more than one byte are skipped.
function odxToLabels(table) {
  const out = [];
  (table.rows || []).flatMap(r => r.params).forEach(p => {
    if (p.byte_pos === undefined || !p.bit_length) return;
    const lo = p.bit_pos || 0, hi = lo + p.bit_length - 1;
    if (hi > 7) return;
    (p.values || []).filter(c => Number(c.low) === Number(c.high)).forEach(c => {
      out.push({byte: p.byte_pos, lo, hi, value: (Number(c.low) << lo) & 0xFF, text: c.text});
    });
  });
  return out;
}
async function codingWrite() {
  const step = codingStep(), u = units.find(u => u.index === unitSel);
  const want = step.work.slice();
  const to = want.map(hex).join(' '), from = step.orig.map(hex).join(' ');
  const diff = want.map((b, i) => b !== step.orig[i] ? `  byte ${i}: ${hex(step.orig[i])} → ${hex(b)}` : null).filter(Boolean);
  if (!diff.length) return;
  if (!confirm(`Write coding to ${u.sname} ${u.id} (${step.sysName})?\n\nFrom: ${from}\nTo:   ${to}\n\nChanges:\n${diff.join('\n')}\n\nThis writes to the control unit.`)) return;
  step.writeMsg = 'Writing coding to the unit…'; step.writeErr = false; renderUnitDetail();
  try {
    await bridge({action: 'write_byte_coding', address: u.id, name: step.sysName, coding: to, login: loginCodes[u.id]});
    // Read the coding back from the unit and confirm it matches what we intended to write.
    step.writeMsg = 'Coding written. Reading it back to verify…'; renderUnitDetail();
    const res = await bridge({action: 'read_coding', address: u.id});
    const entry = (res.coding || []).find(c => c.systemName === step.sysName) || (res.coding || [])[0] || {};
    const got = entry.byteCoding ? bytesOf(entry.byteCoding.replace(/\s/g, '')) : [];
    step.orig = got.slice();  // the unit's actual coding now
    const same = got.length === want.length && got.every((b, i) => b === want[i]);
    if (same) {
      step.work = got.slice();
      step.writeMsg = `Verified: the unit now reads ${got.map(hex).join(' ')}.`; step.writeErr = false;
    } else {
      step.writeMsg = `Write did NOT match. Wanted ${to} but the unit reads ${got.map(hex).join(' ') || '(empty)'}. The differing bytes are highlighted; you can write again.`;
      step.writeErr = true;  // step.work stays at the intended value so the diff is visible
    }
    recordChange({kind: 'coding', address: u.id, unit: u.sname || '', variant: step.unitVariant || '', target: step.sysName,
      oldValue: from, newValue: to, status: same ? 'verified' : 'mismatch',
      note: same ? '' : 'unit reads ' + (got.map(hex).join(' ') || '(empty)')});
  } catch (e) {
    step.writeMsg = e.message; step.writeErr = true;
    recordChange({kind: 'coding', address: u.id, unit: u.sname || '', variant: step.unitVariant || '', target: step.sysName, oldValue: from, newValue: to, status: 'error', note: e.message});
  }
  renderUnitDetail();
}

// Decode the (edited) coding with the user's own .lbl labels, independent of the ODIS database.
async function loadUnitLabels(variant, subsystem) {
  try { return await api('GET', '/api/labels?' + new URLSearchParams({variant: variant || '', subsystem: subsystem || ''})); }
  catch (e) { return []; }
}
function lblDecodeHTML(step) {
  const ls = step.unitLabels || [], where = `${esc(step.unitVariant || '?')} / ${esc(step.sysName)}`;
  const btn = `<button onclick="importUnitLBL()">Import .lbl for ${where}…</button>`;
  if (!ls.length) return `<div class="meta">No .lbl labels stored for ${where}.</div>${btn}`;
  return `<div class="meta">${ls.length} labels for ${where}. ${btn}</div>
    <table class="vals"><tr><th>Byte / bits</th><th>Value</th></tr>${decodeLbl(step.work, ls)}</table>`;
}
function decodeLbl(work, ls) {
  const find = (byte, lo, hi, value) => ls.find(l => l.byte === byte && l.lo === lo && l.hi === hi && l.value === value);
  const fieldsOf = i => {
    const fs = {};
    ls.filter(l => l.byte === i && l.value >= 0).forEach(l => { const k = l.lo + '~' + l.hi; (fs[k] = fs[k] || {lo: l.lo, hi: l.hi, options: []}).options.push(l); });
    return Object.values(fs);
  };
  let rows = ls.filter(l => l.byte === -1).sort((a, b) => a.lo - b.lo).map(n => `<tr><td colspan="2" class="meta">${esc(n.text)}</td></tr>`).join('');
  work.forEach((b, i) => {
    const bl = find(i, 0, 7, -1);
    if (bl) rows += `<tr><th colspan="2">Byte ${i} (${hex(b)}) — ${esc(bl.text)}</th></tr>`;
    fieldsOf(i).forEach(f => {
      const m = mask(f.lo, f.hi), cur = b & m, known = f.options.some(o => o.value === cur);
      const sel = `<select onchange="codingSetField(${i},${m},+this.value)">
        ${known ? '' : `<option selected value="${cur}">0x${hex(cur)} (unknown)</option>`}
        ${f.options.map(o => `<option value="${o.value}" ${o.value === cur ? 'selected' : ''}>${esc(o.text)} (0x${hex(o.value)})</option>`).join('')}</select>`;
      rows += `<tr><td class="mono">Byte ${i} bits ${f.lo}–${f.hi}</td><td>${sel}</td></tr>`;
    });
    for (let bit = 7; bit >= 0; bit--) {
      const l = find(i, bit, bit, -1);
      if (l) {
        const on = (b >> bit) & 1;
        rows += `<tr><td class="mono">Byte ${i} bit ${bit}</td><td><label><input type="checkbox" ${on ? 'checked' : ''}
          onchange="codingSetField(${i},${1 << bit},this.checked?${1 << bit}:0)"> ${esc(l.text)}</label></td></tr>`;
      }
    }
  });
  return rows || `<tr><td colspan="2" class="meta">No labels match these bytes.</td></tr>`;
}

// Writes a single byte's bit field (mask m, value already in position) in the working coding.
function codingSetField(bytePos, m, value) {
  const step = codingStep(); if (!step) return;
  step.work[bytePos] = ((step.work[bytePos] & ~m) | (value & m)) & 0xFF;
  renderUnitDetail();
}
let pendingLblStep = null;
function importUnitLBL() { pendingLblStep = codingStep(); if (pendingLblStep) $('#unitlbl').click(); }
async function onUnitLBL(input) {
  const file = input.files[0], step = pendingLblStep; input.value = '';
  if (!file || !step) return;
  try {
    const n = await api('POST', '/api/labels/import?' + new URLSearchParams({variant: step.unitVariant || '', subsystem: step.sysName}), await file.text());
    step.unitLabels = await loadUnitLabels(step.unitVariant, step.sysName);
    alert(`Imported ${n} labels for ${step.unitVariant} / ${step.sysName}`);
    renderUnitDetail();
  } catch (e) { alert('Import failed: ' + e.message); }
}

// --- Adaptation editor: change a channel's parameter values and write them to the unit ------
function adaptationEditorHTML(step) {
  const ad = step.res.adaptation;
  const params = ad ? (ad.adaptationValues || []).map(v => v.adaptationValue).filter(Boolean) : [];
  if (!params.length) return '';
  step.newVals = step.newVals || {};
  const rows = params.map(p => {
    const nv = (p.name in step.newVals) ? step.newVals[p.name] : p.value;
    return `<tr class="${String(nv) !== String(p.value) ? 'changed' : ''}">
      <td>${esc(p.translatedName && p.translatedName !== '---' ? p.translatedName : p.name)}</td>
      <td class="mono">${esc(p.value)}${p.unit ? ' ' + esc(p.unit) : ''}</td>
      <td>${adaptControl(step, p.name, nv)}</td></tr>`;
  }).join('');
  const changed = params.some(p => (p.name in step.newVals) && String(step.newVals[p.name]) !== String(p.value));
  return `<h2 class="sub">Change adaptation (${esc(step.cmd.channel)})</h2>
    <table class="vals"><tr><th>Parameter</th><th>Current</th><th>New value</th></tr>${rows}</table>
    <div class="bar"><button class="warn" ${changed ? '' : 'disabled'} onclick="adaptWrite()">Write to unit…</button>
      ${step.writeMsg ? `<span class="status ${step.writeErr ? 'err' : ''}">${esc(step.writeMsg)}</span>` : ''}</div>`;
}
// A dropdown of the channel's enumerated options (from ODX) when it has them, else a free input.
function adaptControl(step, name, nv) {
  const opts = (step.options || {})[name];
  if (opts && opts.length) {
    const extra = opts.includes(nv) ? '' : `<option selected value="${esc(nv)}">${esc(nv)} (current)</option>`;
    return `<select onchange="adaptSet('${esc(name)}', this.value)">${extra}${opts.map(o =>
      `<option value="${esc(o)}" ${o === nv ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  return `<input value="${esc(nv)}" onchange="adaptSet('${esc(name)}', this.value)">`;
}
function adaptSet(name, v) { const s = curStep(); if (s) { (s.newVals = s.newVals || {})[name] = v; renderUnitDetail(); } }
async function adaptWrite() {
  const step = curStep(), u = units.find(u => u.index === unitSel), ad = step.res.adaptation;
  const params = (ad.adaptationValues || []).map(v => v.adaptationValue).filter(Boolean);
  const values = {}, diffs = [];
  params.forEach(p => { if ((p.name in step.newVals) && String(step.newVals[p.name]) !== String(p.value)) { values[p.name] = step.newVals[p.name]; diffs.push(`  ${p.name}: ${p.value} → ${step.newVals[p.name]}`); } });
  if (!diffs.length) return;
  if (!confirm(`Write adaptation to ${u.sname} ${u.id}, channel ${step.cmd.channel}?\n\n${diffs.join('\n')}\n\nThis writes to the control unit.`)) return;
  const oldV = params.filter(p => p.name in values).map(p => `${p.name}=${p.value}`).join(', ');
  const newV = Object.entries(values).map(([k, v]) => `${k}=${v}`).join(', ');
  step.writeMsg = 'Writing adaptation…'; step.writeErr = false; renderUnitDetail();
  try {
    await bridge({action: 'write_adaptation', address: u.id, channel: step.cmd.channel, values, login: loginCodes[u.id]});
    // Read the channel back from the unit and confirm each written value took.
    step.writeMsg = 'Adaptation written. Reading it back to verify…'; renderUnitDetail();
    const res = await bridge({action: 'read_adaptation', address: u.id, channel: step.cmd.channel});
    const got = {};
    ((res.adaptation && res.adaptation.adaptationValues) || []).map(v => v.adaptationValue).filter(Boolean)
      .forEach(p => { got[p.name] = p.value; });
    const bad = Object.keys(values).filter(k => String(got[k]) !== String(values[k]));
    step.res = res; step.newVals = {};  // show the unit's actual current values now
    if (!bad.length) {
      step.writeMsg = `Verified: ${newV}.`; step.writeErr = false;
    } else {
      step.writeMsg = `Write did NOT match for ${bad.map(k => `${k} (unit reads ${got[k] === undefined ? '—' : got[k]})`).join(', ')}.`; step.writeErr = true;
    }
    recordChange({kind: 'adaptation', address: u.id, unit: u.sname || '', variant: u.variant || '', target: step.cmd.channel, oldValue: oldV, newValue: newV,
      status: bad.length ? 'mismatch' : 'verified', note: bad.length ? 'unit reads ' + bad.map(k => `${k}=${got[k]}`).join(', ') : ''});
  } catch (e) {
    step.writeMsg = e.message; step.writeErr = true;
    recordChange({kind: 'adaptation', address: u.id, unit: u.sname || '', variant: u.variant || '', target: step.cmd.channel, oldValue: oldV, newValue: newV, status: 'error', note: e.message});
  }
  renderUnitDetail();
}

async function borrowList() {

async function borrowPick(i) {

  step.borrow.chosen = v; step.borrow.table = null; renderUnitDetail();

// Remember / recall which related variant decodes a unit variant with no textual table of its own.
function saveCodingPref(variant, borrowVariant, borrowBase) {
  if (!variant || !borrowVariant) return;
  api('PUT', '/api/coding-pref', {variant, borrowVariant, borrowBase: borrowBase || ''}).catch(() => {});
}
async function loadCodingPref(variant) {
  if (!variant) return null;
  try { const p = await api('GET', '/api/coding-pref?' + new URLSearchParams({variant})); return p && p.borrowVariant ? p : null; }
  catch (e) { return null; }
}
// Applies a remembered borrowed-variant choice to the coding step, loading its definition table.
async function applyCodingPref(step) {
  const pref = await loadCodingPref(step.unitVariant);
  if (!pref) return;
  step.borrow = {chosen: {variant: pref.borrowVariant, base: pref.borrowBase}, remembered: true};
  try { step.borrow.table = await bridge({action: 'odx_table', variant: pref.borrowVariant, base: pref.borrowBase, table: TEXTUAL_TABLE}); }
  catch (e) { step.borrow = null; }
}

// Decodes byte coding (hex, e.g. "01 19 00") with a textual coding definition. A parameter takes
// bit_length bits starting at bit bit_pos of byte byte_pos; values spanning several bytes are big-endian.
function decodeCoding(hexBytes, table) {
  const bytes = (hexBytes || '').trim().split(/\s+/).filter(Boolean).map(h => parseInt(h, 16));
  return table.rows.flatMap(r => r.params).map(p => {
    const base = {name: p.long_name || p.name, byte_pos: p.byte_pos, bit_pos: p.bit_pos || 0, bit_length: p.bit_length, values: p.values || [], unit: p.unit};
    if (p.byte_pos === undefined || !p.bit_length) return {...base, value: '', raw: '—'};
    const n = Math.ceil(((p.bit_pos || 0) + p.bit_length) / 8);
    if (p.byte_pos + n > bytes.length) return {...base, value: 'outside this coding', raw: `byte ${p.byte_pos}`, bad: true};
    let v = 0n;
    for (let i = 0; i < n; i++) v = (v << 8n) | BigInt(bytes[p.byte_pos + i]);
    v = (v >> BigInt(p.bit_pos || 0)) & ((1n << BigInt(p.bit_length)) - 1n);
    const choice = (p.values || []).find(c => BigInt(c.low) <= v && v <= BigInt(c.high));
    return {...base, cur: Number(v), editable: p.bit_length <= 32,
      value: choice ? choice.text : (p.values && p.values.length ? `unknown value ${v}` : `${v}${p.unit ? ' ' + p.unit : ''}`),
      raw: `byte ${p.byte_pos} bit ${p.bit_pos || 0}${p.bit_length > 1 ? '–' + ((p.bit_pos || 0) + p.bit_length - 1) : ''} = ${v}`,
      bad: !choice && p.values && p.values.length > 0};
  });
}

// When editable, each parameter is a dropdown (enumerated values) or a number input that writes
// the chosen value back into the coding bytes at its byte/bit position (shown in the Bits column).
function decodedTable(hexBytes, table, editable) {
  return `<table class="vals"><tr><th>Parameter</th><th>Value</th><th>Bits</th></tr>${decodeCoding(hexBytes, table).map(d => {
    const discrete = (d.values || []).filter(c => Number(c.low) === Number(c.high));
    let cell;
    if (editable && d.editable && discrete.length) {
      const known = discrete.some(c => Number(c.low) === d.cur);
      cell = `<select onchange="codingSetParam(${d.byte_pos},${d.bit_pos},${d.bit_length},+this.value)">
        ${known ? '' : `<option selected value="${d.cur}">0x${d.cur.toString(16).toUpperCase()} (unknown)</option>`}
        ${discrete.map(c => `<option value="${Number(c.low)}" ${Number(c.low) === d.cur ? 'selected' : ''}>${esc(c.text)} (0x${Number(c.low).toString(16).toUpperCase()})</option>`).join('')}</select>`;
    } else if (editable && d.editable && d.byte_pos !== undefined) {
      cell = `<input class="num" value="${d.cur}" onchange="codingSetParam(${d.byte_pos},${d.bit_pos},${d.bit_length},this.value)">${d.unit ? ' ' + esc(d.unit) : ''}`;
    } else {
      cell = esc(d.value);
    }
    return `<tr class="${d.bad ? 'err' : ''}"><td>${esc(d.name)}</td><td>${cell}</td><td class="mono">${esc(d.raw)}</td></tr>`;
  }).join('')}</table>`;
}

// Writes value into the working coding at byte_pos/bit_pos for bit_length bits (big-endian).
function codingSetParam(bytePos, bitPos, bitLen, value) {
  const step = codingStep(); if (!step) return;
  let v = BigInt(Math.max(0, Math.floor(Number(value) || 0)));
  const fieldMax = (1n << BigInt(bitLen)) - 1n; if (v > fieldMax) v = fieldMax;
  const n = Math.ceil((bitPos + bitLen) / 8);
  let cur = 0n;
  for (let i = 0; i < n; i++) cur = (cur << 8n) | BigInt(step.work[bytePos + i]);
  const fieldMask = fieldMax << BigInt(bitPos);
  cur = (cur & ~fieldMask) | ((v << BigInt(bitPos)) & fieldMask);
  for (let i = n - 1; i >= 0; i--) { step.work[bytePos + i] = Number(cur & 0xFFn); cur >>= 8n; }
  renderUnitDetail();
}

function codingDefinitionHTML(step) {
  const odx = step.odx, master = ((step.res && step.res.coding) || [])[0] || {};
  const coding = step.work ? step.work.map(hex).join(' ') : master.byteCoding;
  if (!odx) return '<div class="meta">Looking up the coding definition in the ODIS database…</div>';
  if (odx.own) return `<div class="meta">Decoded with ${esc(odx.own.location || 'its own')} ODX data. Change a value below to edit the coding bytes.</div>${decodedTable(coding, odx.own, true)}`;
  let html = `<div class="meta">${esc(odx.note)}</div>`;
  const b = step.borrow;
  if (!b) return html + '<button onclick="borrowList()">Decode with a related variant…</button>';
  if (b.busy) return html + '<div class="meta">Searching the unit family for variants that define textual coding…</div>';
  if (b.err) html += `<div class="status err">${esc(b.err)}</div>`;
  if (b.list) {
    html += `<div class="meta">${b.list.length} variants of this unit family define textual coding (closest names first):</div>
      ${b.list.length > 20 ? '<input type="text" placeholder="Filter variants" oninput="filterNames(this)">' : ''}
      <div class="names short">${b.list.map((v, i) => `<button class="${b.chosen && b.chosen.variant === v.variant ? 'on' : ''}" onclick="borrowPick(${i})">${esc(v.variant)} (${v.params})</button>`).join('')}</div>`;
  }
  if (b.chosen) {
    html += `<div class="warnbox">Decoded with the definition of <b>${esc(b.chosen.variant)}</b>${b.remembered ? ' <span class="meta">(remembered for ' + esc(step.unitVariant || 'this variant') + ')</span>' : ''}, not of this unit
      (${esc(step.unitVariant || 'unknown variant')}). Its layout may not fit this unit: check the values against what you know about the vehicle
      before writing. Editing here changes the bytes above; review them and use Write to unit with care.</div>`;
    if (!b.list) html += '<button onclick="borrowList()">Decode with a different variant…</button>';
    html += b.table ? decodedTable(coding, b.table, true) : '<div class="meta">Loading the definition…</div>';
  }
  return html;
}

function unitStart(i) { unitPath = []; unitRun(...UNIT_ACTIONS[i]); }

// The webpage only passes the login value; ODIS performs the access handshake for this unit.
let loginCodes = {};  // per-unit login value, sent with each write so the unit unlocks on the same connection
function unitLogin() {
